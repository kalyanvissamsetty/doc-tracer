[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-redline-agent"
version = "0.1.0"
description = "PDF comparison and redline toolkit"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "azure-ai-documentintelligence>=1,<2",
    "pymupdf>=1.26,<2",
    "opencv-python-headless>=4.11,<5",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "pillow>=11,<13",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ui = ["streamlit>=1.55,<2"]
azure = [
    "azure-identity>=1.20,<2",
    "azure-storage-blob>=12.24,<13",
    "azure-monitor-opentelemetry-exporter>=1.0.0b59,<2",
    "opentelemetry-sdk>=1.31,<2",
]

[tool.setuptools.packages.find]
include = ["redline*"]

[tool.setuptools.package-data]
"redline.agent" = ["playbook.md"]

[tool.setuptools.data-files]
"config" = ["config/pressure_test_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
